version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2404:current
    steps:
    - checkout
    - run: sudo apt update
    # Install build tools, doxygen, and automatically pull in all required SFML library build dependencies
    - run: >
        DEBIAN_FRONTEND=noninteractive TZ=Europe/Brussels sudo apt install -y 
        build-essential 
        cmake 
        git 
        doxygen 
        libsfml-dev
    - run: sudo apt build-dep -y libsfml
    - run: mkdir -p build
    - run: cd build && cmake ..
    - run: cd build && make
    - run: cd build && make install
    - run: cd build && make doc
    - store_artifacts:
        path: build/installed
    - store_artifacts:
        path: build/doc
