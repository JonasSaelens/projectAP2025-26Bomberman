version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2404:current
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:j3l9IVIVZHft7lLffJ++XjeM/PLFlze/36aHrdILNJM"
      - checkout
      - run: sudo apt update
      - run: >
          DEBIAN_FRONTEND=noninteractive TZ=Europe/Brussels sudo apt install -y 
          build-essential 
          cmake 
          git 
          doxygen 
          libsfml-dev 
          libudev-dev 
          libopenal-dev 
          libvorbis-dev 
          libogg-dev 
          libflac-dev 
          libxrandr-dev 
          libxcursor-dev 
          libxi-dev 
          libxinerama-dev 
          libfreetype-dev
          graphviz
      - run: mkdir -p build
      - run: cd build && cmake ..
      - run: cd build && make
      - run: cd build && sudo make install
      - run: |
          if [ -f Doxyfile ]; then
            doxygen Doxyfile
          elif [ -f build/Doxyfile ]; then
            cd build && doxygen Doxyfile
          else
            echo "No Doxyfile found, skipping documentation generation."
          fi
      - store_artifacts:
          path: build/installed
      - store_artifacts:
          path: docs
      - run:
          name: Prepare Docs for GitHub Pages
          command: |
            if [ -d "docs" ]; then
              touch docs/.nojekyll
            fi
      - run:
          name: Configure Git Identity
          command: |
            git config --global user.name "CircleCI Build Bot"
            git config --global user.email "build-bot@circleci.local"
      - run:
          name: Commit and Push Doxygen Docs to main
          command: |
            if [ -d "docs" ]; then
              git remote set-url origin git@github.com:$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git
              git checkout main || git checkout -b main
              
              # Add the entire docs directory including html/ and .nojekyll
              git add -f docs/
              
              if git diff --staged --quiet; then
                echo "No documentation changes to deploy."
              else
                git commit -m "chore: Update Doxygen documentation [skip ci]"
                git push origin main
              fi
            else
              echo "Docs directory not found. Skipping deployment."
            fi
